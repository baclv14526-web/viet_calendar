name: viet_calendar
description: Lịch Việt Nam - Dương lịch & Âm lịch với thông báo sự kiện
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  material_design_icons_flutter: ^7.0.7296

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Local Notifications
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

  # Âm lịch
  lunar_calendar_converter: ^1.0.0

  # Local Storage
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Date & Time
  intl: ^0.19.0
  table_calendar: ^3.1.2

  # Permissions
  permission_handler: ^11.3.1

  # Device info (kiểm tra Android API level runtime)
  device_info_plus: ^10.1.2

  # UI Extras
  flutter_slidable: ^3.1.1
  animations: ^2.0.11
  flutter_staggered_animations: ^1.1.1
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  fl_chart: ^0.69.0

  # Utilities
  uuid: ^4.4.2
  collection: ^1.18.0
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/
