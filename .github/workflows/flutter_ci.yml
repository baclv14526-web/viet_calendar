name: 🚀 Flutter CI/CD - Lịch Việt

on:
  push:
    branches: [ main, develop, 'feature/**', 'release/**' ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.22.2'
  JAVA_VERSION: '17'

jobs:
  # ============================================================
  # JOB 1: CODE QUALITY CHECK
  # ============================================================
  quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🔍 Analyze code
        run: flutter analyze --no-fatal-warnings

      - name: 📐 Check formatting
        run: dart format --output=none --set-exit-if-changed lib/
        continue-on-error: true

  # ============================================================
  # JOB 2: RUN TESTS
  # ============================================================
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🧪 Run unit tests
        run: flutter test --coverage --reporter=github

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: success()
        with:
          file: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ============================================================
  # JOB 3: BUILD ANDROID DEBUG APK
  # ============================================================
  build_android_debug:
    name: 🤖 Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🔨 Build APK (Debug)
        run: flutter build apk --debug

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: viet-calendar-debug-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  # ============================================================
  # JOB 4: BUILD ANDROID RELEASE APK + AAB
  # Chỉ chạy khi push lên main hoặc tag v*.*.*
  # Tự detect có keystore secrets hay không và build phù hợp
  # ============================================================
  build_android_release:
    name: 🤖 Android Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release')

    # Expose secrets thành env vars ở job level — cách đúng để kiểm tra secret có tồn tại không
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      # Dùng bash if để kiểm tra — KHÔNG dùng secrets trong step if:
      - name: 🔑 Setup Keystore (nếu có)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "✅ Keystore secret tìm thấy, setup signed build..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks

            # Xóa khoảng trắng thừa khi viết key.properties
            cat > android/key.properties <<PROPS
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=keystore.jks
          PROPS

            echo "✅ key.properties đã tạo"
          else
            echo "⚠️ Không có KEYSTORE_BASE64 secret → build unsigned (debug signature)"
          fi

      - name: 🏗️ Build Release APK
        run: |
          if [ -f "android/key.properties" ]; then
            echo "📦 Building SIGNED release APK..."
            flutter build apk --release --obfuscate --split-debug-info=build/debug_symbols
          else
            echo "📦 Building UNSIGNED release APK (no signing configured)..."
            flutter build apk --release
          fi

      - name: 🏗️ Build Release AAB (Google Play)
        run: |
          if [ -f "android/key.properties" ]; then
            echo "📦 Building SIGNED AAB..."
            flutter build appbundle --release --obfuscate --split-debug-info=build/debug_symbols
          else
            echo "📦 Building UNSIGNED AAB..."
            flutter build appbundle --release
          fi

      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: viet-calendar-release-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: 📤 Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: viet-calendar-release-aab-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # ============================================================
  # JOB 5: CREATE GITHUB RELEASE (chỉ khi push tag v*.*.*)
  # ============================================================
  create_release:
    name: 🎉 Create GitHub Release
    runs-on: ubuntu-latest
    needs: [ build_android_release ]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📥 Download APK artifact
        uses: actions/download-artifact@v4
        with:
          pattern: viet-calendar-release-apk-*
          merge-multiple: true
          path: release_artifacts/

      - name: 📥 Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          pattern: viet-calendar-release-aab-*
          merge-multiple: true
          path: release_artifacts/

      - name: 📋 Generate changelog
        id: changelog
        run: |
          CURR_TAG=${GITHUB_REF#refs/tags/}
          PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]' | sed -n '2p')

          if [ -z "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s" | head -20)
          else
            CHANGES=$(git log "${PREV_TAG}..${CURR_TAG}" --pretty=format:"- %s")
          fi

          # Dùng delimiter ngẫu nhiên để tránh conflict với nội dung
          EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "CHANGES<<$EOF_MARKER" >> "$GITHUB_OUTPUT"
          echo "$CHANGES"            >> "$GITHUB_OUTPUT"
          echo "$EOF_MARKER"         >> "$GITHUB_OUTPUT"

      - name: 🎉 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Lịch Việt ${{ github.ref_name }}'
          body: |
            ## 🗓️ Lịch Việt ${{ github.ref_name }}

            ### 📱 Tải về
            - **APK** – cài trực tiếp trên Android: `app-release.apk`
            - **AAB** – đăng tải Google Play: `app-release.aab`

            ### 🆕 Thay đổi
            ${{ steps.changelog.outputs.CHANGES }}

            ### ✨ Tính năng chính
            - 📅 Lịch dương lịch & âm lịch Việt Nam
            - 🏮 Ngày lễ truyền thống (Tết, Vu Lan, Trung Thu…)
            - 🇻🇳 Ngày lễ quốc gia (30/4, 1/5, 2/9, 8/3, 20/10…)
            - 🔔 Thông báo popup như Google Calendar
            - 🌙 Hiển thị ngày âm lịch trên mỗi ô lịch

          files: |
            release_artifacts/*.apk
            release_artifacts/*.aab
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}

  # ============================================================
  # JOB 6: BUILD SUMMARY
  # ============================================================
  notify:
    name: 📬 Build Summary
    runs-on: ubuntu-latest
    needs: [ quality, test, build_android_debug ]
    if: always()

    steps:
      - name: 📊 Write summary
        run: |
          echo "## 🗓️ Lịch Việt – Build Summary" >> $GITHUB_STEP_SUMMARY
          echo ""                                  >> $GITHUB_STEP_SUMMARY
          echo "| Job            | Status |"       >> $GITHUB_STEP_SUMMARY
          echo "|----------------|--------|"       >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality   | ${{ needs.quality.result }} |"           >> $GITHUB_STEP_SUMMARY
          echo "| Tests          | ${{ needs.test.result }} |"               >> $GITHUB_STEP_SUMMARY
          echo "| Android Debug  | ${{ needs.build_android_debug.result }} |" >> $GITHUB_STEP_SUMMARY
          echo ""                                  >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`"  >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`"        >> $GITHUB_STEP_SUMMARY
          echo "**Flutter:** ${{ env.FLUTTER_VERSION }}"  >> $GITHUB_STEP_SUMMARY
