name: viet_calendar
description: Lịch Việt Nam - Dương lịch & Âm lịch với thông báo sự kiện
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Local Notifications
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

  # Local Storage
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Date & Time
  intl: ^0.19.0
  table_calendar: ^3.1.2

  # Permissions & Device Info
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.2

  # UI Extras
  flutter_slidable: ^3.1.1
  flutter_staggered_animations: ^1.1.1
  google_fonts: ^6.2.1

  # Utilities
  uuid: ^4.4.2
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
